name: CI

# This repository lints and tests itself with the very action and rules it
# publishes. Extraction moved security-relevant lines out of the consumers'
# self-testing perimeter, so the assertions have to live here now — see
# tests/contract.mjs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate the harness
    runs-on: sutro-k8s-runner-set
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # Dogfooding on purpose: if the published action cannot lint this
      # repository's workflows, it cannot be trusted to lint a consumer's.
      - name: Lint workflows with the published action
        uses: ./actions/actionlint

      # The self-hosted image carries python3 but no Node — the contract tests
      # failed with `node: command not found` on their first run, on a runner
      # whose consumers' workflows all say this in a comment somewhere.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19.0"

      - name: Contract tests
        run: node tests/contract.mjs
